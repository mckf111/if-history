<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">城破前夜：刻下无名</title>
  <desc id="desc">1644 年北京城破前夜，姚小满用刻刀和文书争门、册、人的局部命运；右侧展示一封假信如何沿着相信、翻墙与二十鞭连成真实对局因果。</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L9 5L0 10Z" fill="#df5a43"/>
    </marker>
    <pattern id="paper-noise" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 18H36M18 0V36" stroke="#f2e7ce" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#101318"/>
  <rect width="1200" height="420" fill="url(#paper-noise)"/>
  <path d="M0 88H1200M0 354H1200" stroke="#f2e7ce" stroke-opacity=".12"/>
  <path d="M626 0L566 420" stroke="#b8392d" stroke-width="4"/>

  <g id="title-block" transform="translate(64 48)">
    <text x="0" y="18" fill="#ee725e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="700" letter-spacing="5">免费中文历史推演游戏 · 1644 北京</text>
    <text x="0" y="111" fill="#f2e7ce" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="82" font-weight="700">城破前夜</text>
    <text x="2" y="168" fill="#df5a43" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="42" font-weight="700" letter-spacing="8">刻下无名</text>
    <text x="0" y="237" fill="#f2e7ce" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="27">城会破，但小人物的命还没写死。</text>
    <text x="0" y="277" fill="#d1a447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="600">三天 · 十二个时辰 · 一把刻刀</text>
    <g transform="translate(0 318)">
      <rect width="42" height="42" fill="none" stroke="#df5a43" stroke-width="3" transform="rotate(-3 21 21)"/>
      <text x="21" y="23" fill="#ee725e" font-family="Georgia, 'Songti SC', serif" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">刻</text>
      <text x="60" y="27" fill="#b9b09d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">20–40 MIN · BROWSER · SEEDED CAUSAL SIM</text>
    </g>
  </g>

  <g id="real-run" transform="translate(678 47)">
    <text x="0" y="18" fill="#d1a447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="3">REAL RUN / 完整因果可回看</text>
    <text x="0" y="83" fill="#f2e7ce" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="48" font-weight="700">一封假信</text>
    <text x="258" y="83" fill="#ee725e" font-family="Georgia, 'Songti SC', 'Noto Serif SC', SimSun, serif" font-size="29" font-weight="700">二十鞭</text>

    <path d="M44 171H395" fill="none" stroke="#df5a43" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(0 129)">
      <rect width="92" height="84" fill="#f2e7ce" stroke="#d1a447" stroke-width="2"/>
      <path d="M66 0L92 26H66Z" fill="#e4d4ae"/>
      <text x="46" y="51" fill="#74251f" font-family="Georgia, 'Songti SC', serif" font-size="24" font-weight="700" text-anchor="middle">假信</text>
    </g>

    <g transform="translate(119 139)">
      <circle cx="37" cy="32" r="34" fill="#101318" stroke="#5f9b8d" stroke-width="3"/>
      <text x="37" y="36" fill="#78b6a8" font-family="Georgia, 'Songti SC', serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">相信</text>
    </g>

    <g transform="translate(232 139)">
      <circle cx="37" cy="32" r="34" fill="#101318" stroke="#d1a447" stroke-width="3"/>
      <text x="37" y="36" fill="#f2e7ce" font-family="Georgia, 'Songti SC', serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="middle">翻墙</text>
    </g>

    <g transform="translate(344 129) rotate(-2 50 42)">
      <rect width="100" height="84" fill="#74251f" stroke="#ee725e" stroke-width="3"/>
      <text x="50" y="51" fill="#f2e7ce" font-family="Georgia, 'Songti SC', serif" font-size="25" font-weight="700" text-anchor="middle">二十鞭</text>
    </g>

    <text x="0" y="257" fill="#b9b09d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">事件节点预写；这条完整链由这一局接成。</text>
    <g transform="translate(0 291)">
      <rect width="454" height="56" fill="none" stroke="#f2e7ce" stroke-opacity=".24"/>
      <text x="18" y="24" fill="#d1a447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">FIXED SEED · PURE RULES · FULL LEDGER</text>
      <text x="18" y="44" fill="#b9b09d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15">固定种子 · 纯函数规则 · 每颗骰子入账</text>
    </g>
  </g>

  <path d="M674 390H768V361H840V390H916V344H994V390H1070V368H1138V390H1200" fill="none" stroke="#f2e7ce" stroke-opacity=".34" stroke-width="2"/>
</svg>
