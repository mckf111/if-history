name: Test and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Upload dist for Gitee mirror
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-gitee
          path: dist
          retention-days: 2

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-gitee:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-gitee
          path: dist
      - name: Publish dist to Gitee Pages branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_PAGES_BRANCH: ${{ vars.GITEE_PAGES_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 secrets.GITEE_TOKEN，跳过 Gitee 镜像部署。见 docs/DEPLOY-GITEE.md"
            exit 0
          fi

          GITEE_OWNER="${GITEE_OWNER:-caowenhu}"
          GITEE_REPO="${GITEE_REPO:-if-history}"
          GITEE_PAGES_BRANCH="${GITEE_PAGES_BRANCH:-gh-pages}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work="$(mktemp -d)"
          cp -a dist/. "$work/"
          cd "$work"
          touch .nojekyll
          git init
          git checkout -b "$GITEE_PAGES_BRANCH"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA:-manual}"

          # Gitee HTTPS：用户名 + 私人令牌
          remote="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
          git push --force "$remote" "HEAD:${GITEE_PAGES_BRANCH}"

          echo "已推送到 gitee.com/${GITEE_OWNER}/${GITEE_REPO}@${GITEE_PAGES_BRANCH}"

          code="$(curl -sS -o /tmp/gitee-pages-build.json -w "%{http_code}" \
            -X POST "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/pages/builds" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"access_token\":\"${GITEE_TOKEN}\"}")"
          echo "Gitee Pages 重建 HTTP ${code}"
          cat /tmp/gitee-pages-build.json || true
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::warning::Pages 重建 API 未成功（常见原因：尚未在 Gitee 网页上首次开通 Pages）。分支已更新，开通后点一次「更新」即可。"
          else
            echo "国内镜像：https://${GITEE_OWNER}.gitee.io/${GITEE_REPO}/"
          fi
